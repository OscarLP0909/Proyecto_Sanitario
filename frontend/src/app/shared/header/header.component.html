<header class="h-16 bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between px-6">
  <div class="flex items-center gap-2">
    <span class="text-sm text-gray-500 dark:text-gray-400">
      <span class="font-medium text-gray-700 dark:text-gray-200">
        {{ auth.userRole() }}
      </span>
    </span>
  </div>

  <div class="flex items-center gap-4">
    <!-- Theme toggle -->
    <button
      (click)="theme.toggle()"
      class="w-9 h-9 rounded-lg bg-gray-100 dark:bg-gray-800 flex items-center justify-center text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors"
      [title]="theme.isDark() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
    >
      {{ theme.isDark() ? '☀' : '☾' }}
    </button>

    <!-- User info -->
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center text-white text-sm font-semibold">
        {{ auth.userFullName().charAt(0).toUpperCase() }}
      </div>
      <span class="text-sm font-medium text-gray-700 dark:text-gray-200 hidden sm:block">
        {{ auth.userFullName() }}
      </span>
    </div>

    <!-- Logout -->
    <button
      (click)="auth.logout()"
      class="flex items-center gap-2 px-3 py-2 text-sm text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-lg transition-colors"
    >
      <span>⏻</span>
      <span class="hidden sm:block">Salir</span>
    </button>
  </div>
</header>
